name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      npm_tag: ${{ steps.release-meta.outputs.npm_tag }}
      prerelease: ${{ steps.release-meta.outputs.prerelease }}
      publish_mcp_registry: ${{ steps.release-meta.outputs.publish_mcp_registry }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and channel
        id: release-meta
        run: npx tsx scripts/verify-release-tag.ts "${{ github.ref_name }}"

      - name: Run release gate
        run: npm run release:verify

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG
        run: node scripts/extract-changelog-section.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: false

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use OIDC-capable npm CLI
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm with Trusted Publishing
        run: npm publish --tag "${{ needs.build.outputs.npm_tag }}"

  publish-mcp-registry:
    needs: [build, publish-npm]
    if: needs.build.outputs.publish_mcp_registry == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Sync server.json version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          export VERSION
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            j.version = process.env.VERSION;
            if (Array.isArray(j.packages)) {
              for (const pkg of j.packages) pkg.version = process.env.VERSION;
            }
            fs.writeFileSync('server.json', JSON.stringify(j, null, 2) + '\n');
          "
          echo "Publishing MCP Registry metadata for version ${VERSION}"

      - name: Install MCP Publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Login to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
