name: DevControl MCP + Web cross-platform checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/devcontrol/**"
      - "src/index.ts"
      - "src/cli/**"
      - ".github/workflows/devcontrol-web.yml"

permissions:
  contents: read

jobs:
  common-mcp-web:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run src/devcontrol/__tests__ --reporter=dot
      - run: npm run build
